# Overrides on top of detekt's default config (buildUponDefaultConfig = true).

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

complexity:
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    ignorePrivate: true
    ignoreAnnotatedFunctions: ['Composable', 'Preview']

style:
  # Failures propagate with `result.getOrElse { return it }` (typed early returns instead of exceptions),
  # so a use case naturally has one return per gateway call.
  ReturnCount:
    active: false
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated: ['Composable', 'Preview']
    excludes: ['**/test/**', '**/androidTest/**', '**/theme/**', '**/*.kts']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  ForbiddenComment:
    comments: ['FIXME:', 'STOPSHIP:']
  MaxLineLength:
    maxLineLength: 120

# Jetpack Compose rules (io.nlopez.compose.rules).
Compose:
  ComposableAnnotationNaming:
    active: true
  ComposableNaming:
    active: true
  CompositionLocalAllowlist:
    active: true
    allowedCompositionLocals: LocalGullakColors,LocalGullakTypography
  ContentEmitterReturningValues:
    active: true
  ModifierComposable:
    active: true
  ModifierMissing:
    active: true
  ModifierNaming:
    active: true
  ModifierNotUsedAtRoot:
    active: true
  ModifierReused:
    active: true
  ModifierWithoutDefault:
    active: true
  MultipleEmitters:
    active: true
  MutableParams:
    active: true
  MutableStateParam:
    active: true
  ParameterOrder:
    active: true
  PreviewPublic:
    active: true
  RememberMissing:
    active: true
  ViewModelForwarding:
    active: true
  ViewModelInjection:
    active: true
  Material2:
    active: true
